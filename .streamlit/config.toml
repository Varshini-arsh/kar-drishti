# Pragya - Streamlit settings. Colours and font follow branding.py
# (white, minimal; teal #0F766E accent; Inter font).

[browser]
# keep everything offline: do not send usage statistics
gatherUsageStats = false

[client]
# viewer menu: hides developer options
toolbarMode = "viewer"

[server]
maxUploadSize = 200
# serves the Inter font from ./static so it works without internet
enableStaticServing = true

[theme]
# always white
base = "light"
font = "Inter, Segoe UI, Arial, sans-serif"
baseFontSize = 15
baseRadius = "10px"
buttonRadius = "8px"
showWidgetBorder = false
headingFontWeights = [700, 650, 600]
# colours (white, minimal)
primaryColor = "#0F766E"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F7F7F6"
textColor = "#18181B"
borderColor = "#ECECEA"
dataframeBorderColor = "#F0F0EE"
dataframeHeaderBackgroundColor = "#FFFFFF"
linkColor = "#0F766E"
chartCategoricalColors = ["#0F766E", "#D97706", "#DC2626", "#78716C", "#14B8A6", "#A8A29E"]


[[theme.fontFaces]]
family = "Inter"
url = "app/static/Inter-latin.woff2"
weight = "100 900"
style = "normal"

[[theme.fontFaces]]
family = "Inter"
url = "app/static/Inter-latin-ext.woff2"
weight = "100 900"
style = "normal"

[theme.sidebar]
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F7F7F6"
borderColor = "#F0F0EE"
